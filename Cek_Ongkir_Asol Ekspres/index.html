<html>
    <head>
        <title>Asol Ekspres</title>
     <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="kotak-ongkir"></div>
        <h1>Cek Tarif Pengiriman</h1>
        <p>Pilih wilayah tujuan pengiriman paket</p>

        <select id="tujuan">
        <option value="dalam_kota">Dalam Kota (Yogyakarta)</option>
        <option value="luar_kota">Luar Kota (Pulau Jawa)</option>
        <option value="luar_pulau">Luar Pulau Jawa</option>
        <option value="luar_negeri">Luar Negeri (Asia)</option>        </select>
        <br><br>
        <button onclick="cekOngkir()">
            Cek Tarif
        </button>

        <h2 id="hasilOngkir">
            Silahkan pilih tujuan pengiriman
        </h2>
    </div>
    <script>
        function cekOngkir() {
                let wilayah =
                document.getElementById("tujuan"). value;
                let infoTarif = "";
                if (wilayah == "dalam_kota") {
                    infoTarif = "Tarif: Rp 10.000 (Estimasi 1 hari)";
                }
                else if (wilayah == "luar_kota") {
                    infoTarif = "Tarif: Rp 20.000 (Estimasi 2-3 hari)";
                }
                else if (wilayah == "luar_pulau") {
                    infoTarif = "Tarif: Rp 45.000 (Estimasi 4-7 hari)";
                }
                else if (wilayah == "luar_negeri") {
                    infoTarif = "Tarif: Rp 160.000 (Estimasi 7-10 hari)";
                }
                document.getElementById("hasilOngkir").innerText = infoTarif
            }
        </script>
    </script>
    </body>
</html>
